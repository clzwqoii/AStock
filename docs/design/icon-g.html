<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; }
  body { width:1024px; height:1024px; background:#ddd; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .icon { width:1024px; height:1024px; border-radius:232px; overflow:hidden; position:relative;
          background: linear-gradient(165deg, #ffffff 0%, #f7f8fa 70%, #f1f3f7 100%);
          box-shadow: inset 0 0 0 2px rgba(0,0,0,.06); }
  .arrow { position:absolute; left:130px; top:200px; }
  .bars { position:absolute; left:160px; bottom:160px; display:flex; align-items:flex-end; gap:40px; }
  .bar { width:80px; border-radius:14px 14px 0 0;
         background:linear-gradient(180deg,#eceff4,#dde2ea); }
</style></head>
<body>
  <div class="icon">
    <div class="bars">
      <div class="bar" style="height:130px"></div>
      <div class="bar" style="height:200px"></div>
      <div class="bar" style="height:290px"></div>
    </div>
    <svg class="arrow" width="820" height="700" viewBox="0 0 820 700">
      <path d="M 70 640 L 440 300 L 490 350 L 660 140"
            fill="none" stroke="url(#g)" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
      <defs>
        <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#f77f3e"/>
          <stop offset="1" stop-color="#d7263d"/>
        </linearGradient>
      </defs>
      <path d="M 540 118 L 768 104 L 686 316 Z" fill="#d7263d"/>
      <circle cx="768" cy="104" r="30" fill="#d7263d"/>
    </svg>
  </div>
</body>
</html>
