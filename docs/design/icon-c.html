<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; }
  body { width:1024px; height:1024px; background:#ddd; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .icon { width:1024px; height:1024px; border-radius:232px; overflow:hidden; position:relative;
          background: linear-gradient(145deg, #f0455a 0%, #c22740 60%, #a01c33 100%); }
  .sheen { position:absolute; left:-200px; top:-300px; width:900px; height:700px; border-radius:50%;
           background:radial-gradient(closest-side, rgba(255,255,255,.22), transparent); }
  .lens { position:absolute; left:200px; top:180px; width:470px; height:470px; border-radius:50%;
          border:46px solid #ffffff; background:rgba(255,255,255,.14);
          box-shadow: 0 24px 70px rgba(90,0,10,.35); }
  .handle { position:absolute; width:56px; height:270px; border-radius:28px; background:#ffffff;
            transform: rotate(-45deg); left:640px; top:610px; box-shadow: 0 18px 40px rgba(90,0,10,.3); }
  .candle { position:absolute; width:64px; border-radius:9px; }
  .wick { position:absolute; left:50%; width:8px; transform:translateX(-50%); border-radius:4px; }
  .c1 { left:315px; top:330px; height:120px; background:#ffffff; } .c1 .wick { top:-30px; height:180px; background:#ffffff; }
  .c2 { left:430px; top:290px; height:160px; background:#ffd3d9; } .c2 .wick { top:-36px; height:232px; background:#ffd3d9; }
</style></head>
<body>
  <div class="icon">
    <div class="sheen"></div>
    <div class="lens"></div>
    <div class="candle c1"><div class="wick"></div></div>
    <div class="candle c2"><div class="wick"></div></div>
    <div class="handle"></div>
  </div>
</body>
</html>
