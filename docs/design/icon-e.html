<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; }
  body { width:1024px; height:1024px; background:#ddd; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .icon { width:1024px; height:1024px; border-radius:232px; overflow:hidden; position:relative;
          background: linear-gradient(160deg, #14524a 0%, #0b3a33 50%, #062621 100%); }
  .glass { position:absolute; left:-100px; top:-350px; width:1300px; height:700px; border-radius:50%;
           background:radial-gradient(closest-side, rgba(255,255,255,.16), transparent); }
  .grid { position:absolute; inset:0;
          background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
          background-size: 128px 128px; }
  .candle { position:absolute; width:96px; border-radius:16px; }
  .wick { position:absolute; left:50%; width:12px; transform:translateX(-50%); border-radius:6px; }
  .c1 { left:170px; bottom:230px; height:260px;
        background:linear-gradient(180deg,#ff8a94,#e0313e 60%,#b81f31);
        box-shadow: inset 0 10px 14px rgba(255,255,255,.4), inset 0 -12px 18px rgba(0,0,0,.28), 0 26px 50px rgba(0,0,0,.4); }
  .c1 .wick { top:-56px; height:372px; background:linear-gradient(180deg,#ff8a94,#b81f31); }
  .c2 { left:390px; bottom:300px; height:220px;
        background:linear-gradient(180deg,#5fd9c0,#12a385 60%,#0b7a63);
        box-shadow: inset 0 10px 14px rgba(255,255,255,.4), inset 0 -12px 18px rgba(0,0,0,.28), 0 26px 50px rgba(0,0,0,.4); }
  .c2 .wick { top:-46px; height:312px; background:linear-gradient(180deg,#5fd9c0,#0b7a63); }
  .c3 { left:610px; bottom:380px; height:290px;
        background:linear-gradient(180deg,#ff8a94,#e0313e 60%,#b81f31);
        box-shadow: inset 0 10px 14px rgba(255,255,255,.45), inset 0 -12px 18px rgba(0,0,0,.28), 0 30px 60px rgba(0,0,0,.45); }
  .c3 .wick { top:-62px; height:408px; background:linear-gradient(180deg,#ff8a94,#b81f31); }
</style></head>
<body>
  <div class="icon">
    <div class="grid"></div>
    <div class="candle c1"><div class="wick"></div></div>
    <div class="candle c2"><div class="wick"></div></div>
    <div class="candle c3"><div class="wick"></div></div>
    <div class="glass"></div>
  </div>
</body>
</html>
